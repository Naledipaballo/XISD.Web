<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Pill Point Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="max-width: 500px; margin: 40px auto; padding: 20px;">
    <div class="box">
        <h2>Create Account</h2>

        <div id="error-alert" style="display:none; background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 14px;"></div>
        <div id="success-alert" style="display:none; background: #d4edda; color: #155724; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 14px;"></div>

        <form id="signup-form">
            <input type="text" id="first_name" placeholder="First Name" required style="width:100%; padding:10px; margin-bottom:12px; box-sizing:border-box;">
            <input type="text" id="last_name" placeholder="Last Name" required style="width:100%; padding:10px; margin-bottom:12px; box-sizing:border-box;">
            <input type="number" id="age" placeholder="Age (Must be 18+)" required style="width:100%; padding:10px; margin-bottom:12px; box-sizing:border-box;">
            <input type="text" id="phone" placeholder="Phone Number" required style="width:100%; padding:10px; margin-bottom:12px; box-sizing:border-box;">
            <input type="email" id="email" placeholder="Email Address" required style="width:100%; padding:10px; margin-bottom:12px; box-sizing:border-box;">
            <input type="text" id="address" placeholder="Street Address" required style="width:100%; padding:10px; margin-bottom:12px; box-sizing:border-box;">
            <input type="text" id="username" placeholder="Username" required style="width:100%; padding:10px; margin-bottom:12px; box-sizing:border-box;">
            <input type="password" id="password" placeholder="Password (Min 6 characters)" required style="width:100%; padding:10px; margin-bottom:15px; box-sizing:border-box;">
            
            <button type="submit" class="btn" style="width:100%; padding:12px;">Sign Up</button>
        </form>

        <br>
        <p style="text-align: center;">Already have an account? <a href="login.html">Login</a></p>
    </div>
</div>

<!-- Firebase SDKs & Firestore Signup Logic -->

<script type="module">
    // Import the shared Firebase configuration
    import { auth, db } from "./firebase.js";

    // Firebase Authentication SDK version 12.0.0
    import {
        createUserWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    // Cloud Firestore SDK version 12.0.0
    import {
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const signupForm = document.getElementById("signup-form");
    const errorAlert = document.getElementById("error-alert");
    const successAlert = document.getElementById("success-alert");

    function showError(message) {
        errorAlert.textContent = message;
        errorAlert.style.display = "block";
        successAlert.style.display = "none";
    }

    signupForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        errorAlert.style.display = "none";
        successAlert.style.display = "none";

        const firstName = document.getElementById("first_name").value.trim();
        const lastName = document.getElementById("last_name").value.trim();
        const age = Number(document.getElementById("age").value);
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const address = document.getElementById("address").value.trim();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        // Validate age
        if (!Number.isInteger(age) || age < 18) {
            showError("You must be at least 18 years old to register.");
            return;
        }

        // Validate password
        if (password.length < 6) {
            showError("Your password must contain at least 6 characters.");
            return;
        }

        const submitButton = signupForm.querySelector(
            'button[type="submit"]'
        );

        submitButton.disabled = true;
        submitButton.textContent = "Creating account...";

        let createdUser = null;

        try {

            // Create customer account in Firebase Authentication
            const userCredential = await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

            createdUser = userCredential.user;

            // Save customer information in Cloud Firestore
            await setDoc(doc(db, "users", createdUser.uid), {

                userId: createdUser.uid,
                firstName: firstName,
                lastName: lastName,
                age: age,
                phone: phone,
                email: email,
                address: address,
                username: username,

                // Identify this account as a customer
                role: "customer",

                createdAt: serverTimestamp()

            });

            // Sign out after registration
            await signOut(auth);

            successAlert.textContent =
                "Account created successfully! Redirecting to login...";

            successAlert.style.display = "block";

            signupForm.reset();

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);

        } catch (error) {

            console.error("Customer signup error:", error);

            // If Firestore saving failed after account creation,
            // sign out but do not attempt to create the account again.
            if (createdUser && auth.currentUser) {
                try {
                    await signOut(auth);
                } catch (signOutError) {
                    console.error("Sign out error:", signOutError);
                }
            }

            if (error.code === "auth/email-already-in-use") {
                showError("This email address is already registered.");

            } else if (error.code === "auth/invalid-email") {
                showError("Please enter a valid email address.");

            } else if (error.code === "auth/weak-password") {
                showError("Please choose a stronger password.");

            } else if (error.code === "permission-denied") {
                showError(
                    "Account authentication succeeded, but Firestore denied saving your profile. Please check your security rules."
                );

            } else {
                showError("Registration failed: " + error.message);
            }

        } finally {

            submitButton.disabled = false;
            submitButton.textContent = "Sign Up";
        }
    });
</script>
</body>
</html>
