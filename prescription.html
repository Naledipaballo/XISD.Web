<div id="main">

   <h1 class="title">Prescriptions</h1>

<div class="prescription-container">


    <form>

        <div class="row">
            <div class="input-box">
                <label>Patient Name</label>
                <input type="text" placeholder="Enter Patient Name" required>
            </div>

            <div class="input-box">
                <label>Doctor's Name</label>
                <input type="text" placeholder="Enter Doctor's Name" required>
            </div>
        </div>

        <div class="row">
            <div class="input-box full">
                <label>Prescription Number</label>
                <input type="text" placeholder="Prescription Number">
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label>Prescription Date</label>
                <input type="date" required>
            </div>

            <div class="input-box">
                <label>Delivery Method</label>
                <select required>
                    <option>Select Method</option>
                    <option>Home Delivery</option>
                    <option>Collect In Store</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label>Upload Prescription</label>
                <input type="file" required>
            </div>

            <div class="input-box">
                <label>Additional Notes</label>
                <textarea rows="4" placeholder="Enter any special instructions"></textarea>
            </div>
        </div>

        <button class="btn">Upload Prescription</button>

    </form>

</div>
    </div>



<script src="script.js"></script>

</body>
