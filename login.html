<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pill Point Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="box">
        <h2>Login</h2>

        <div id="error-alert" style="display:none; background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 14px;"></div>
        <div id="success-alert" style="display:none; background: #d4edda; color: #155724; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 14px;"></div>

        <form id="login-form">
            <input type="text" id="login_input" placeholder="Email Address or Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="submit" value="Login" class="btn">
        </form>

        <br>

        <p style="text-align: center;">Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>
    </div>
</div>

<!-- Firebase SDKs & Login Logic -->
<script type="module">
    import { db, auth } from "./script.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { ref, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const loginInput = document.getElementById('login_input').value.trim();
        const password = document.getElementById('password').value;

        const errorAlert = document.getElementById('error-alert');
        const successAlert = document.getElementById('success-alert');
        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';

        try {
            let emailToUse = loginInput;

            // If the input does not look like an email, assume it's a username and lookup the email in Firebase Realtime Database
            if (!loginInput.includes('@')) {
                const usersRef = ref(db, 'users');
                const usernameQuery = query(usersRef, orderByChild('username'), equalTo(loginInput));
                const snapshot = await get(usernameQuery);

                if (snapshot.exists()) {
                    const userData = Object.values(snapshot.val())[0];
                    emailToUse = userData.email;
                } else {
                    throw new Error("Invalid username or password.");
                }
            }

            // Authenticate with Firebase Auth
            await signInWithEmailAndPassword(auth, emailToUse, password);

            successAlert.textContent = "Login successful! Redirecting to dashboard...";
            successAlert.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);

        } catch (error) {
            console.error("Login Error:", error);
            errorAlert.textContent = "Invalid username/email or password.";
            errorAlert.style.display = 'block';
        }
    });
</script>

</body>
</html>
