<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pill Point Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="max-width: 450px; margin: 60px auto; padding: 20px;">
    <div class="box">
        <h2 style="text-align: center; color: #003049; margin-bottom: 20px;">Login</h2>

        <div id="error-alert" style="display:none; background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 14px;"></div>
        <div id="success-alert" style="display:none; background: #d4edda; color: #155724; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 14px;"></div>

        <form id="login-form">
            <div style="margin-bottom: 15px;">
                <input type="email" id="email" placeholder="Email Address" required style="width:100%; padding:12px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-size:15px;">
            </div>
            <div style="margin-bottom: 20px;">
                <input type="password" id="password" placeholder="Password" required style="width:100%; padding:12px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-size:15px;">
            </div>
            
            <button type="submit" class="btn" style="width:100%; padding:12px; background:#669BBC; color:white; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer;">Login</button>
        <a href="admin-login.html" class="admin-login-button">
    Admin Login
</a>
        </form>

        <br>
        <p style="text-align: center; font-size: 14px; color: #64748b;">Don't have an account? <a href="signup.html" style="color: #003049; font-weight: bold;">Sign Up</a></p>
    </div>
</div>

<!-- Firebase SDKs & Login Logic -->

<script type="module">
    // Import shared Firebase configuration
    import { auth, db } from "./firebase.js";

    // Firebase Authentication SDK 12.0.0
    import {
        signInWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    // Cloud Firestore SDK 12.0.0
    import {
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const loginForm = document.getElementById("login-form");
    const errorAlert = document.getElementById("error-alert");
    const successAlert = document.getElementById("success-alert");
    const loginButton = loginForm.querySelector('button[type="submit"]');

    function showError(message) {
        errorAlert.textContent = message;
        errorAlert.style.display = "block";
        successAlert.style.display = "none";
    }

    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        errorAlert.style.display = "none";
        successAlert.style.display = "none";

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {

            // Sign in customer using Firebase Authentication
            const userCredential = await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            const user = userCredential.user;

            // Retrieve customer profile from Firestore
            const userRef = doc(db, "users", user.uid);
            const userSnapshot = await getDoc(userRef);

            if (!userSnapshot.exists()) {

                await signOut(auth);

                showError(
                    "Your customer profile was not found. Please contact support."
                );

                return;
            }

            // Read account role
            const userData = userSnapshot.data();
            const role = String(userData.role || "customer")
                .trim()
                .toLowerCase();

            // Prevent administrators from using customer login
            if (role === "admin") {

                await signOut(auth);

                showError(
                    "Please use the Admin Login page to access your account."
                );

                return;
            }

            successAlert.textContent =
                "Login successful! Redirecting to dashboard...";

            successAlert.style.display = "block";

            // Redirect customer to dashboard
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1000);

        } catch (error) {

            console.error("Customer Login Error:", error);

            if (
                error.code === "auth/invalid-credential" ||
                error.code === "auth/wrong-password" ||
                error.code === "auth/user-not-found"
            ) {
                showError("Invalid email or password. Please try again.");

            } else if (error.code === "permission-denied") {
                showError(
                    "Unable to access your customer profile. Please check Firestore permissions."
                );

                await signOut(auth);

            } else {
                showError("Login failed: " + error.message);
            }

        } finally {

            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }
    });
</script>
</body>
</html>
