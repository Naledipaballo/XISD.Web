<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Pill Point Delivery</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            color: #003049;
        }

        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            background-color: #003049;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 10px 15px 10px 30px;
            text-decoration: none;
            font-size: 18px;
            color: #fff;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #669BBC;
        }

        .sidebar .closebtn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 36px;
        }

        .cart-page-container {
            width: 90%;
            max-width: 650px;
            margin: 110px auto 40px auto;
        }

        .cart-page-title {
            text-align: center;
            color: #003049;
            font-size: 32px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .cart-items-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .cart-item-card {
            background: #fff;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-title {
            font-size: 16px;
            font-weight: bold;
            color: #003049;
            margin-bottom: 4px;
            text-transform: capitalize;
        }

        .cart-item-price {
            font-size: 15px;
            font-weight: bold;
            color: #C1121F;
            margin-top: 4px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .qty-input {
            width: 50px;
            text-align: center;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .remove-btn {
            background: #C1121F;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 6px;
        }

        .remove-btn:hover {
            background: #780000;
        }

        .cart-summary-box {
            background: #fff;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
            color: #475569;
        }

        .summary-row.total-row {
            font-size: 18px;
            font-weight: bold;
            color: #003049;
            border-top: 1px solid #eee;
            padding-top: 12px;
            margin-top: 12px;
        }

        .cart-action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: #669BBC;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            flex: 1;
        }

        .btn:hover {
            background: #003049;
        }

        .btn-outline {
            background: transparent;
            color: #003049;
            border: 2px solid #003049;
        }

        .btn-outline:hover {
            background: #003049;
            color: white;
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <span class="menu-btn" onclick="openNav()" style="cursor: pointer; font-size: 22px;">&#9776;</span>
    <h1 class="header-title">Pill Point Delivery</h1>
</div>

<!-- Sidebar -->
<!-- CUSTOMER SIDEBAR -->
    <div id="sidebar" class="sidebar">

        <a href="javascript:void(0)"
           class="closebtn"
           onclick="closeNav()"
           aria-label="Close menu">
            &times;
        </a>
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="medicines.html">Shop Medication</a>
    <a href="prescription.html">Prescription</a>
    <a href="reminders.html">Reminders</a>
    <a href="storelocator.html">Store Locator</a>
    <a href="cart.html">Cart</a>
    <a href="trackorder.html">Track Order</a>
    <a href="myaccount.html">My Account</a>
    <a href="contact.html">Contact Us</a>
    <a href="#" id="logout-link">Logout</a>
</div>

<div class="cart-page-container">
    <h2 class="cart-page-title">Shopping Cart</h2>

    <!-- Dynamic Cart Container -->
    <div id="cart-content-area">
        <p style="text-align: center; color: #64748b;">Loading cart items...</p>
    </div>
</div>

<!-- Firebase SDKs and Firestore Cart Logic -->
<script type="module">
    import { db, auth } from "./script.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { collection, query, where, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const SHIPPING_FEE = 35.00;
    let currentUserCartDocs = [];

    // 1. Monitor Authentication State
    onAuthStateChanged(auth, (user) => {
        if (user) {
            fetchUserCart(user.uid);
        } else {
            alert('Please login first.');
            window.location.href = 'login.html';
        }
    });

    // 2. Fetch Cart Items from Cloud Firestore
    async function fetchUserCart(userId) {
        try {
            const cartRef = collection(db, "cart");
            const q = query(cartRef, where("userId", "==", userId));
            const querySnapshot = await getDocs(q);
            const container = document.getElementById('cart-content-area');

            if (!querySnapshot.empty) {
                currentUserCartDocs = querySnapshot.docs;
                let htmlContent = '';
                let subtotal = 0;

                htmlContent += `<div class="cart-items-list" id="items-list-wrapper">`;

                currentUserCartDocs.forEach((docSnap) => {
                    const item = docSnap.data();
                    const cartId = docSnap.id;
                    const itemTotal = item.price * item.quantity;
                    subtotal += itemTotal;

                    htmlContent += `
                        <div class="cart-item-card" data-id="${cartId}">
                            <div class="cart-item-details">
                                <div class="cart-item-title">${escapeHtml(item.medicine_name)}</div>
                                <div class="cart-item-price">R${Number(item.price).toFixed(2)}</div>
                                
                                <div class="cart-item-controls">
                                    <label style="font-size: 13px; font-weight: bold; color: #003049;">Qty:</label>
                                    <input type="number" value="${item.quantity}" min="1" class="qty-input" data-id="${cartId}" id="qty_${cartId}">
                                    
                                    <button type="button" class="remove-btn" onclick="removeItem('${cartId}')">Remove</button>
                                </div>
                            </div>
                        </div>`;
                });

                htmlContent += `</div>`;

                const grandTotal = subtotal > 0 ? subtotal + SHIPPING_FEE : 0.00;

                // Summary Box & Actions
                htmlContent += `
                    <div class="cart-summary-box">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>R${subtotal.toFixed(2)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping Fee</span>
                            <span>R${SHIPPING_FEE.toFixed(2)}</span>
                        </div>
                        <div class="summary-row total-row">
                            <span>Total</span>
                            <span>R${grandTotal.toFixed(2)}</span>
                        </div>
                    </div>

                    <div class="cart-action-buttons">
                        <button type="button" class="btn btn-outline" onclick="updateQuantities()">Update Quantities</button>
                        <a href="checkout.html" class="btn">Checkout Now</a>
                    </div>
                `;

                container.innerHTML = htmlContent;
            } else {
                container.innerHTML = `
                    <div style="background: #fff; border-radius: 12px; padding: 40px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
                        <p style="font-size: 16px; color: #64748b; margin-bottom: 20px;">Your shopping cart is currently empty.</p>
                        <a href="medicines.html" class="btn" style="display: inline-block; width: auto; padding: 12px 30px; text-decoration: none;">Shop Medication</a>
                    </div>
                `;
            }
        } catch (error) {
            console.error("Error fetching cart:", error);
        }
    }

    // 3. Update Quantities Functionality
    window.updateQuantities = async function() {
        const user = auth.currentUser;
        if (!user) return;

        try {
            const updatePromises = currentUserCartDocs.map(async (docSnap) => {
                const cartId = docSnap.id;
                const qtyInput = document.getElementById(`qty_${cartId}`);
                if (qtyInput) {
                    const newQty = parseInt(qtyInput.value);
                    if (newQty > 0) {
                        const itemRef = doc(db, "cart", cartId);
                        await updateDoc(itemRef, { quantity: newQty });
                    }
                }
            });

            await Promise.all(updatePromises);
            alert("Cart quantities updated successfully!");
            fetchUserCart(user.uid);
        } catch (error) {
            console.error("Error updating quantities:", error);
            alert("Failed to update quantities.");
        }
    };

    // 4. Remove Item Functionality
    window.removeItem = async function(cartId) {
        const user = auth.currentUser;
        if (!user) return;

        if (confirm("Are you sure you want to remove this item from your cart?")) {
            try {
                const itemRef = doc(db, "cart", cartId);
                await deleteDoc(itemRef);
                fetchUserCart(user.uid);
            } catch (error) {
                console.error("Error removing item:", error);
                alert("Failed to remove item.");
            }
        }
    };

    // Sidebar Navigation Helpers
    window.openNav = function() {
        document.getElementById("sidebar").style.width = "250px";
    }

    window.closeNav = function() {
        document.getElementById("sidebar").style.width = "0";
    }

    // Helper function to prevent XSS
    function escapeHtml(text) {
        if (!text) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.toString().replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    // Handle Logout
    document.getElementById('logout-link').addEventListener('click', (e) => {
        e.preventDefault();
        signOut(auth).then(() => {
            window.location.href = 'login.html';
        }).catch((error) => {
            console.error('Logout error:', error);
        });
    });
</script>

</body>
</html>
