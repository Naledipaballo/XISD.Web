
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - Pill Point Delivery</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #DFEEF3;
            color: #003049;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 65px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            color: #003049;
            font-size: 22px;
            white-space: nowrap;
        }

        .menu-btn {
            cursor: pointer;
            font-size: 25px;
            color: #003049;
            background: none;
            border: none;
        }

        /* SIDEBAR */

        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            background-color: #003049;
            overflow-x: hidden;
            transition: width 0.3s ease;
            padding-top: 60px;
            white-space: nowrap;
        }

        .sidebar.sidebar-open {
            width: 250px;
        }

        .sidebar a {
            padding: 10px 15px 10px 30px;
            text-decoration: none;
            font-size: 18px;
            color: #fff;
            display: block;
        }

        .sidebar a:hover {
            background-color: #669BBC;
        }

        .sidebar .closebtn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 36px;
        }

        /* CART PAGE */

        .cart-page-container {
            width: 90%;
            max-width: 750px;
            margin: 110px auto 40px;
        }

        .cart-page-title {
            text-align: center;
            color: #003049;
            font-size: 32px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .cart-items-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .cart-item-card {
            background: #fff;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .cart-item-details {
            flex-grow: 1;
            min-width: 0;
        }

        .cart-item-title {
            font-size: 17px;
            font-weight: bold;
            color: #003049;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        .cart-item-price {
            font-size: 15px;
            font-weight: bold;
            color: #C1121F;
            margin-top: 4px;
        }

        .cart-item-subtotal {
            margin-top: 6px;
            color: #475569;
            font-size: 14px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .qty-input {
            width: 65px;
            text-align: center;
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .remove-btn {
            background: #C1121F;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .remove-btn:hover {
            background: #780000;
        }

        /* SUMMARY */

        .cart-summary-box {
            background: #fff;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 15px;
            color: #475569;
        }

        .summary-row.total-row {
            font-size: 18px;
            font-weight: bold;
            color: #003049;
            border-top: 1px solid #eee;
            padding-top: 12px;
            margin-top: 12px;
        }

        /* BUTTONS */

        .cart-action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: #669BBC;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            flex: 1;
        }

        .btn:hover {
            background: #003049;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            color: #003049;
            border: 2px solid #003049;
        }

        .btn-outline:hover {
            background: #003049;
            color: white;
        }

        /* EMPTY CART */

        .empty-cart {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .message {
            text-align: center;
            margin: 15px 0;
            color: #003049;
            line-height: 1.5;
        }

        .error-message {
            color: #C1121F;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .cart-action-buttons {
                flex-direction: column;
            }

            .header-title {
                font-size: 17px;
            }

            .cart-page-title {
                font-size: 26px;
            }

            .cart-item-card {
                padding: 14px;
            }

            .sidebar.sidebar-open {
                width: 85%;
                max-width: 280px;
            }
        }
    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <button type="button"
                class="menu-btn"
                id="open-menu"
                aria-label="Open navigation">
            &#9776;
        </button>

        <h1 class="header-title">
            Pill Point Delivery
        </h1>

    </div>


    <!-- SIDEBAR -->

    <div id="sidebar" class="sidebar">

        <a href="#" class="closebtn" id="close-menu">
            &times;
        </a>

        <a href="dashboard.html">Dashboard</a>

        <a href="medicines.html">Shop Medication</a>

        <a href="prescription.html">Prescription</a>

        <a href="reminders.html">Reminders</a>

        <a href="storelocator.html">Store Locator</a>

        <a href="cart.html">Cart</a>

        <a href="checkout.html">Checkout</a>

        <a href="trackorder.html">Track Order</a>

        <a href="myaccount.html">My Account</a>

        <a href="contact.html">Contact Us</a>

        <a href="#" id="logout-link">Logout</a>

    </div>


    <!-- CART CONTENT -->

    <main class="cart-page-container">

        <h2 class="cart-page-title">
            Shopping Cart
        </h2>

        <p id="cart-message" class="message">
            Connecting to your account...
        </p>

        <div id="cart-content-area">

            <p class="message">
                Please wait...
            </p>

        </div>

    </main>


    <!-- FIREBASE CART LOGIC -->

    <script type="module">

        // =========================================
        // FIREBASE IMPORTS
        // =========================================

        import { db, auth } from "./firebase.js";

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        import {
            collection,
            query,
            where,
            getDocs,
            doc,
            updateDoc,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


        // =========================================
        // SETTINGS
        // =========================================

        const SHIPPING_FEE = 50.00;

        let currentUser = null;

        let currentUserCartDocs = [];

        let cartLoading = false;

        const container =
            document.getElementById("cart-content-area");

        const message =
            document.getElementById("cart-message");


        // =========================================
        // SIDEBAR
        // =========================================

        const sidebar =
            document.getElementById("sidebar");

        const openButton =
            document.getElementById("open-menu");

        const closeButton =
            document.getElementById("close-menu");


        openButton.addEventListener("click", () => {

            sidebar.classList.add("sidebar-open");

        });


        closeButton.addEventListener("click", (event) => {

            event.preventDefault();

            sidebar.classList.remove("sidebar-open");

        });


        document.addEventListener("click", (event) => {

            if (
                sidebar.classList.contains("sidebar-open") &&
                !sidebar.contains(event.target) &&
                !openButton.contains(event.target)
            ) {

                sidebar.classList.remove("sidebar-open");

            }

        });


        document.addEventListener("keydown", (event) => {

            if (event.key === "Escape") {

                sidebar.classList.remove("sidebar-open");

            }

        });


        // =========================================
        // SAFE HTML
        // =========================================

        function escapeHtml(value) {

            const characters = {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            };

            return String(value ?? "").replace(
                /[&<>"']/g,
                character => characters[character]
            );

        }


        // =========================================
        // AUTHENTICATION
        // =========================================

        onAuthStateChanged(

            auth,

            async (user) => {

                if (!user) {

                    currentUser = null;

                    message.textContent =
                        "Please sign in to view your cart.";

                    container.innerHTML = "";

                    window.location.href = "login.html";

                    return;

                }

                currentUser = user;

                console.log("PILL POINT DELIVERY CART");

                console.log("Customer email:", user.email);

                console.log("Customer UID:", user.uid);

                await fetchUserCart();

            },

            (error) => {

                console.error(
                    "Authentication error:",
                    error
                );

                message.textContent =
                    "Unable to verify your account. Please refresh the page.";

                container.innerHTML = "";

            }

        );


        // =========================================
        // FETCH CUSTOMER CART
        // =========================================

        async function fetchUserCart() {

            if (!currentUser || cartLoading) {
                return;
            }

            cartLoading = true;

            message.textContent = "Loading your cart...";

            container.innerHTML = "";

            try {

                // Automatically retrieve the logged-in user's UID.
                const userId = currentUser.uid;

                console.log(
                    "Fetching cart for authenticated UID:",
                    userId
                );


                // FIRESTORE CART COLLECTION
                const cartRef = collection(db, "cart");


                // GET ONLY THE CURRENT CUSTOMER'S CART ITEMS
                const cartQuery = query(

                    cartRef,

                    where("userId", "==", userId)

                );


                const snapshot = await getDocs(cartQuery);

                currentUserCartDocs = snapshot.docs;


                console.log(
                    "Cart documents found:",
                    snapshot.size
                );


                snapshot.forEach((document) => {

                    console.log(
                        "Cart item:",
                        document.id,
                        document.data()
                    );

                });


                if (snapshot.empty) {

                    displayEmptyCart();

                    return;

                }


                renderCartItems();


            } catch (error) {

                console.error(
                    "FIRESTORE CART ERROR:",
                    error
                );

                message.textContent =
                    "Unable to load your cart.";

                container.innerHTML = `

                    <div class="empty-cart error-message">

                        <h3>Cart Loading Error</h3>

                        <p>${escapeHtml(error.message)}</p>

                        <button
                            type="button"
                            class="btn"
                            id="retry-cart">

                            Try Again

                        </button>

                    </div>

                `;


                document.getElementById("retry-cart")
                    .addEventListener("click", fetchUserCart);

            } finally {

                cartLoading = false;

            }

        }


        // =========================================
        // DISPLAY CART ITEMS
        // =========================================

        function renderCartItems() {

            let subtotal = 0;

            let totalQuantity = 0;

            let html = `
                <div class="cart-items-list">
            `;


            currentUserCartDocs.forEach((document) => {

                const item = document.data();

                const cartId = document.id;


                // GET MEDICATION DETAILS
                const itemName =
                    item.medicationName ||
                    item.name ||
                    item.medicationID ||
                    "Medication";


                const itemPrice = Number(
                    item.unitPrice ?? item.price
                );


                const quantity = Number(item.quantity);


                // VALIDATE DATA
                if (

                    !Number.isFinite(itemPrice) ||
                    itemPrice < 0 ||

                    !Number.isInteger(quantity) ||
                    quantity < 1

                ) {

                    console.error(
                        "Invalid cart item:",
                        cartId,
                        item
                    );

                    return;

                }


                // CALCULATE ITEM TOTAL
                const itemSubtotal = itemPrice * quantity;

                subtotal += itemSubtotal;

                totalQuantity += quantity;


                // BUILD CART ITEM
                html += `

                    <div class="cart-item-card">

                        <div class="cart-item-details">

                            <div class="cart-item-title">

                                ${escapeHtml(itemName)}

                            </div>


                            <div class="cart-item-price">

                                Unit Price:
                                R${itemPrice.toFixed(2)}

                            </div>


                            <div class="cart-item-subtotal">

                                Item Total:
                                R${itemSubtotal.toFixed(2)}

                            </div>


                            <div class="cart-item-controls">

                                <label for="qty-${escapeHtml(cartId)}">

                                    Quantity:

                                </label>


                                <input

                                    type="number"

                                    class="qty-input"

                                    id="qty-${escapeHtml(cartId)}"

                                    value="${quantity}"

                                    min="1"

                                    max="99"

                                >


                                <button

                                    type="button"

                                    class="remove-btn"

                                    data-remove-id="${escapeHtml(cartId)}">

                                    Remove

                                </button>

                            </div>

                        </div>

                    </div>

                `;

            });


            html += `</div>`;


            // CHECK IF THERE ARE VALID ITEMS
            if (totalQuantity === 0) {

                displayEmptyCart();

                return;

            }


            // CALCULATE FINAL TOTAL
            const total = subtotal + SHIPPING_FEE;


            // CART SUMMARY
            html += `

                <div class="cart-summary-box">


                    <div class="summary-row">

                        <span>Total Items</span>

                        <span>${totalQuantity}</span>

                    </div>


                    <div class="summary-row">

                        <span>Subtotal</span>

                        <span>R${subtotal.toFixed(2)}</span>

                    </div>


                    <div class="summary-row">

                        <span>Delivery Fee</span>

                        <span>R${SHIPPING_FEE.toFixed(2)}</span>

                    </div>


                    <div class="summary-row total-row">

                        <span>Total</span>

                        <span>R${total.toFixed(2)}</span>

                    </div>


                </div>


                <div class="cart-action-buttons">


                    <button

                        type="button"

                        class="btn btn-outline"

                        id="update-cart-btn">

                        Update Quantities

                    </button>


                    <a href="checkout.html" class="btn">

                        Checkout Now

                    </a>


                </div>

            `;


            container.innerHTML = html;


            message.textContent =
                `${totalQuantity} medication item(s) in your cart.`;


            // REMOVE BUTTON EVENTS
            container.querySelectorAll("[data-remove-id]")
                .forEach((button) => {

                    button.addEventListener("click", () => {

                        removeItem(button.dataset.removeId);

                    });

                });


            // UPDATE QUANTITIES BUTTON
            document.getElementById("update-cart-btn")
                .addEventListener("click", updateQuantities);

        }


        // =========================================
        // EMPTY CART
        // =========================================

        function displayEmptyCart() {

            currentUserCartDocs = [];

            message.textContent =
                "Your cart is empty.";

            container.innerHTML = `

                <div class="empty-cart">

                    <h3>Your Shopping Cart is Empty</h3>

                    <p>

                        You have not added any medication
                        to your cart yet.

                    </p>


                    <a

                        href="medicines.html"

                        class="btn"

                        style="display:inline-block;
                               width:auto;
                               padding:12px 30px;">

                        Shop Medication

                    </a>

                </div>

            `;

        }


        // =========================================
        // UPDATE QUANTITIES
        // =========================================

        async function updateQuantities() {

            if (!currentUser) {

                alert("Please sign in first.");

                return;

            }


            const button =
                document.getElementById("update-cart-btn");


            button.disabled = true;

            button.textContent = "Updating...";


            try {

                const updates = currentUserCartDocs.map(
                    async (cartDocument) => {

                        const cartId = cartDocument.id;

                        const itemData = cartDocument.data();


                        // VERIFY OWNERSHIP
                        if (itemData.userId !== currentUser.uid) {

                            throw new Error(
                                "You cannot update another customer's cart."
                            );

                        }


                        const input = document.getElementById(
                            "qty-" + cartId
                        );


                        if (!input) {
                            return;
                        }


                        const newQuantity = Number(input.value);


                        if (

                            !Number.isInteger(newQuantity) ||

                            newQuantity < 1 ||

                            newQuantity > 99

                        ) {

                            throw new Error(
                                "Enter a quantity between 1 and 99."
                            );

                        }


                        // UPDATE FIRESTORE
                        await updateDoc(

                            doc(db, "cart", cartId),

                            {
                                quantity: newQuantity
                            }

                        );

                    }
                );


                await Promise.all(updates);


                alert(
                    "Cart quantities updated successfully!"
                );


                await fetchUserCart();


            } catch (error) {

                console.error(
                    "Quantity update error:",
                    error
                );

                alert(
                    "Unable to update cart: " + error.message
                );

                await fetchUserCart();

            }

        }


        // =========================================
        // REMOVE CART ITEM
        // =========================================

        async function removeItem(cartId) {

            if (!currentUser) {
                return;
            }


            const confirmed = confirm(
                "Are you sure you want to remove this medication?"
            );


            if (!confirmed) {
                return;
            }


            try {

                const itemToRemove = currentUserCartDocs.find(

                    document => document.id === cartId

                );


                if (!itemToRemove) {

                    throw new Error(
                        "Cart item was not found."
                    );

                }


                const itemData = itemToRemove.data();


                // VERIFY ITEM OWNERSHIP
                if (itemData.userId !== currentUser.uid) {

                    throw new Error(
                        "You cannot remove another customer's item."
                    );

                }


                // DELETE CART DOCUMENT
                await deleteDoc(

                    doc(db, "cart", cartId)

                );


                console.log(
                    "Cart item removed:",
                    cartId
                );


                await fetchUserCart();


                message.textContent =
                    "Medication removed from your cart.";


            } catch (error) {

                console.error(
                    "Remove item error:",
                    error
                );

                alert(
                    "Unable to remove item: " + error.message
                );

            }

        }


        // =========================================
        // LOGOUT
        // =========================================

        document.getElementById("logout-link")
            .addEventListener("click", async (event) => {

                event.preventDefault();

                try {

                    await signOut(auth);

                    window.location.href = "login.html";

                } catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                    alert(
                        "Unable to log out. Please try again."
                    );

                }

            });

    </script>

</body>

</html>
