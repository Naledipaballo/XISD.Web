<!DOCTYPE html>
<html>
<head>
    <title>Store Locator - Pill Point Delivery</title>

    <link rel="stylesheet" href="style.css">

    <script>
        function findStore(){

            var address = document.getElementById("address").value;

            if(address==""){
                alert("Please enter your address.");
                return;
            }

            var map =
            "https://www.google.com/maps?q=" +
            encodeURIComponent(address + " pharmacy") +
            "&output=embed";

            document.getElementById("map").src = map;
        }
    </script>

</head>

<body>

<!-- HEADER -->

<div class="header">

    <span class="menu-btn" onclick="openNav()">&#9776;</span>

    <h1 class="header-title">Pill Point Delivery</h1>

    <a href="myaccount.html">
        <img src="photo.jpeg" class="profile-icon">
    </a>

</div>

<!-- SIDEBAR -->

<div id="sidebar" class="sidebar">

    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>

    <a href="dashboard.html">Dashboard</a>
    <a href="shop.html">Shop Medication</a>
    <a href="prescription.html">Prescription</a>
    <a href="reminders.html">Reminders</a>
    <a href="storelocator.html">Store Locator</a>
    <a href="cart.html">Cart</a>
    <a href="myaccount.html">My Account</a>
    <a href="contact.html">Contact Us</a>
    <a href="login.html">Logout</a>

</div>

<!-- STORE LOCATOR -->

<div class="locator-container">

    <h2>Store Locator</h2>

    <p>Enter your address to find the nearest pharmacy.</p>

    <input
        type="text"
        id="address"
        placeholder="Enter your address">

    <button onclick="findStore()" class="btn">
        Find Pharmacy
    </button>

    <iframe
        id="map"
        src="https://www.google.com/maps?q=pharmacy&output=embed">
    </iframe>

</div>

<script src="script.js"></script>

</body>
</html>
