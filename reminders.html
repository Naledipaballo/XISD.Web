<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Reminder - Pill Point Delivery</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            color: #003049;
        }

        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            background-color: #003049;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 10px 15px 10px 30px;
            text-decoration: none;
            font-size: 18px;
            color: #fff;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #669BBC;
        }

        .sidebar .closebtn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 36px;
            margin-left: 50px;
        }

        .reminder-container {
            max-width: 650px;
            margin: 110px auto 40px auto;
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .reminder-container h2 {
            color: #003049;
            text-align: center;
            margin-bottom: 8px;
        }

        .reminder-container p.subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #003049;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }

        .btn {
            background: #669BBC;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
        }

        .btn:hover {
            background: #003049;
        }
    </style>
</head>
<body>

<div class="header">
    <span class="menu-btn" onclick="openNav()" style="cursor: pointer; font-size: 22px;">&#9776;</span>
    <h1 class="header-title">Pill Point Delivery</h1>
</div>

<div id="sidebar" class="sidebar">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="medicines.html">Shop Medication</a>
    <a href="prescription.html">Prescription</a>
    <a href="reminders.html">Set Reminder</a>
    <a href="viewreminders.html">My Reminders</a>
    <a href="storelocator.html">Store Locator</a>
    <a href="cart.html">Cart</a>
    <a href="trackorder.html">Track Order</a>
    <a href="myaccount.html">My Account</a>
    <a href="viewreminders.html">View Reminders</a>
    <a href="#" id="logout-link">Logout</a>
</div>

<div class="reminder-container">
    <h2>Medication Reminders</h2>
    <p class="subtitle">Set reminders so you never miss a dose</p>

    <div id="error-alert" style="display:none; background: #f8d7da; color: #721c24; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 20px;"></div>
    <div id="success-alert" style="display:none; background: #d4edda; color: #155724; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 20px;"></div>

    <form id="reminder-form">
        <div class="form-group">
            <label>Medication Name *</label>
            <input type="text" id="medication_name" required placeholder="e.g. Allergex Tablets">
        </div>

        <div class="form-group">
            <label>Dosage *</label>
            <input type="text" id="dosage" required placeholder="e.g. 1 Tablet (50mg)">
        </div>

        <div class="form-group">
            <label>Reminder Time *</label>
            <input type="time" id="reminder_time" required>
        </div>

        <div class="form-group">
            <label>Reminder Date *</label>
            <input type="date" id="reminder_date" required>
        </div>

        <div class="form-group">
            <label>Repeat Frequency *</label>
            <select id="repeat_frequency" required>
                <option value="Once Off">Once Off</option>
                <option value="Daily">Daily</option>
                <option value="Twice Daily">Twice Daily</option>
                <option value="Weekly">Weekly</option>
                <option value="As Needed">As Needed</option>
            </select>
        </div>

        <div class="form-group">
            <label>Notification Type *</label>
            <select id="notification_type" required>
                <option value="Push Notification">Push Notification</option>
                <option value="SMS Alert">SMS Alert</option>
                <option value="Email Alert">Email Alert</option>
            </select>
        </div>

        <div class="form-group">
            <label>Notes / Instructions (Optional)</label>
            <textarea id="notes" rows="3" placeholder="e.g. Take with food"></textarea>
        </div>

        <button type="submit" class="btn">Save Reminder</button>
    </form>
</div>

<!-- Firebase SDKs and Reminder Logic -->
<script type="module">
    import { db, auth } from "./script.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Verify User Authentication on Load
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            alert('Please login first.');
            window.location.href = 'login.html';
        }
    });

    // 2. Handle Form Submission
    document.getElementById('reminder-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = auth.currentUser;
        if (!user) {
            alert('Please login first.');
            window.location.href = 'login.html';
            return;
        }

        const medicationName = document.getElementById('medication_name').value.trim();
        const dosage = document.getElementById('dosage').value.trim();
        const reminderTime = document.getElementById('reminder_time').value.trim();
        const reminderDate = document.getElementById('reminder_date').value.trim();
        const repeatFrequency = document.getElementById('repeat_frequency').value;
        const notificationType = document.getElementById('notification_type').value;
        const notes = document.getElementById('notes').value.trim();

        const errorAlert = document.getElementById('error-alert');
        const successAlert = document.getElementById('success-alert');
        errorAlert.style.display = 'none';
        successAlert.style.display = 'none';

        if (!medicationName || !dosage || !reminderTime || !reminderDate || !repeatFrequency || !notificationType) {
            errorAlert.textContent = "Please fill in all required reminder fields.";
            errorAlert.style.display = 'block';
            return;
        }

        try {
            const remindersRef = ref(db, `reminders/${user.uid}`);
            const newReminderRef = push(remindersRef);

            await set(newReminderRef, {
                medication_name: medicationName,
                dosage: dosage,
                reminder_time: reminderTime,
                reminder_date: reminderDate,
                repeat_frequency: repeatFrequency,
                notification_type: notificationType,
                notes: notes,
                created_at: new Date().toISOString()
            });

            successAlert.textContent = "Reminder saved successfully!";
            successAlert.style.display = 'block';
            document.getElementById('reminder-form').reset();

            setTimeout(() => {
                window.location.href = 'view_reminders.html';
            }, 1500);

        } catch (error) {
            console.error("Error saving reminder:", error);
            errorAlert.textContent = "Database error saving reminder: " + error.message;
            errorAlert.style.display = 'block';
        }
    });

    // Sidebar Navigation Helpers
    window.openNav = function() {
        document.getElementById("sidebar").style.width = "250px";
    }

    window.closeNav = function() {
        document.getElementById("sidebar").style.width = "0";
    }

    // Handle Logout
    document.getElementById('logout-link').addEventListener('click', (e) => {
        e.preventDefault();
        signOut(auth).then(() => {
            window.location.href = 'login.html';
        }).catch((error) => {
            console.error('Logout error:', error);
        });
    });
</script>

</body>
</html>
