<div class="reminder-container">

   
    <h2>Medication Reminders</h2>

    <form>

        <div class="row">

            <div class="input-box">
                <label>Medication Name</label>
                <input type="text" placeholder="Enter medication name" required>
            </div>

            <div class="input-box">
                <label>Dosage</label>
                <input type="text" placeholder="e.g. 2 Tablets" required>
            </div>

        </div>

        <div class="row">

            <div class="input-box">
                <label>Reminder Time</label>
                <input type="time" required>
            </div>

            <div class="input-box">
                <label>Reminder Date</label>
                <input type="date" required>
            </div>

        </div>

        <div class="row">

            <div class="input-box">
                <label>Repeat</label>

                <select required>
                    <option value="">Select</option>
                    <option>Daily</option>
                    <option>Weekly</option>
                    <option>Monthly</option>
                </select>

            </div>

            <div class="input-box">
                <label>Notification Type</label>

                <select required>
                    <option value="">Select</option>
                    <option>Email</option>
                    <option>SMS</option>
                    <option>App Notification</option>
                </select>

            </div>

        </div>

        <div class="input-box full">

            <label>Notes</label>

            <textarea placeholder="Additional instructions..."></textarea>

        </div>

        <button type="submit" class="btn">
            Save Reminder
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>
